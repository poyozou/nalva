<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <!-- Concentric hexagons -->
  <g transform="translate(60, 60)" stroke="#e8e5de" fill="none">
    <!-- Outermost hexagon -->
    <polygon points="0,-48 41.6,-24 41.6,24 0,48 -41.6,24 -41.6,-24" stroke-width="0.8" opacity="0.7"/>
    <!-- Hexagon 2 -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" stroke-width="0.8" opacity="0.7"/>
    <!-- Hexagon 3 -->
    <polygon points="0,-33 28.6,-16.5 28.6,16.5 0,33 -28.6,16.5 -28.6,-16.5" stroke-width="0.7" opacity="0.65"/>
    <!-- Hexagon 4 -->
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" stroke-width="0.7" opacity="0.6"/>
    <!-- Hexagon 5 -->
    <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" stroke-width="0.6" opacity="0.55"/>
    <!-- Hexagon 6 -->
    <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7" stroke-width="0.6" opacity="0.5"/>
    <!-- Hexagon 7 (innermost) -->
    <polygon points="0,-8 6.9,-4 6.9,4 0,8 -6.9,4 -6.9,-4" stroke-width="0.5" opacity="0.45"/>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="3" stroke-width="0.6" opacity="0.6"/>
  </g>
  <!-- NALVA text -->
  <text x="130" y="72" font-family="'Jost', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="300" letter-spacing="0.22em" fill="#e8e5de" opacity="0.9">NALVA</text>
</svg>
